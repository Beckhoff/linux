image: ${REGISTRY_HOST}/beckhoff/bdpg:v13.3.1

variables:
  GIT_DEPTH: 10

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

docker-image-build:
  image: ${REGISTRY_HOST}/beckhoff/okinak:master
  stage: .pre
  parallel:
    matrix:
      - TARGET_ARCH:
        - amd64
        - arm64
  tags:
    - ${TARGET_ARCH}
    - docker-v2-privileged
  script:
    - okinak build-native --file=Dockerfile

.build:
  stage: build
  image: ${CI_REGISTRY_IMAGE}/build:${CI_COMMIT_REF_SLUG}-${BHF_CI_ARCH}
  timeout: 30m
  tags:
    - docker-v2
    - ${BHF_CI_ARCH}
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - ./*.deb
      - ./*.debian.tar.xz
      - ./*.dsc
      - ./*.orig.tar.gz

build:
  extends: .build
  parallel:
    matrix:
      - BHF_CI_ARCH:
          - amd64
          - arm64
  script:
    - ./build-packages.sh binary

build-src:
  extends: .build
  variables:
    BHF_CI_ARCH: "arm64"
  tags:
    - docker-v2
    - multiarch
  script:
    - ./build-packages.sh source

test:
  stage: test
  parallel:
    matrix:
      - LINUX_CI_RUN_MANUALLY: "n"
      - LINUX_CI_RUN_MANUALLY: "y"
        BHF_CI_DO_INSTALL: "y"
      - LINUX_CI_RUN_MANUALLY: "y"
        BHF_CI_CYCLICTEST_DURATION: "180m"
        BHF_CI_DO_INSTALL: "y"
        BHF_CI_TEST_LIST: "cyclictest"
  trigger:
    project: beckhoff/test-tcos
    branch: bhf/13/trixie
    strategy: depend
    forward:
      pipeline_variables: true
  variables:
    BHF_CI_PIPELINE_REPOS: "linux/${CI_PIPELINE_ID}"
  rules:
    - if: $BHF_CI_SKIP_TEST == "y"
      when: never
    - if: $LINUX_CI_RUN_MANUALLY == "y"
      when: manual
    - when: on_success

publish:
  stage: .post
  needs: ["build", "build-src"]
  script:
    - bdpg push --skip-changelog-check ./linux-headers-*.deb ./linux-image-*.deb ./linux-*.dsc
  when: manual
