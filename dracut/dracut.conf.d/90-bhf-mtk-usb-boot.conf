# Universal USB / storage stack:
#   usbcore        - USB core                                 CONFIG_USB=m
#   usb-common     - USB common helpers                       CONFIG_USB_COMMON=m
#   xhci-hcd       - xHCI host controller core                CONFIG_USB_XHCI_HCD=m
#   usb-storage    - USB Mass Storage / BOT                   CONFIG_USB_STORAGE=m
#   uas            - USB Attached SCSI                        CONFIG_USB_UAS=m
#   scsi_mod       - SCSI midlayer                            CONFIG_SCSI=m
#   sd_mod         - SCSI disk / block device                 CONFIG_BLK_DEV_SD=m
force_drivers+=" usbcore usb-common xhci-hcd usb-storage uas scsi_mod sd_mod "

# MediaTek-specific (SoC USB IP):
#   mtu3           - SSUSB dual-role controller (&ssusb0/1)   CONFIG_USB_MTU3=m
#   xhci-mtk-hcd   - MediaTek xHCI host glue                  CONFIG_USB_XHCI_MTK=m
#   phy-mtk-tphy   - MediaTek T-PHY for the USB ports         CONFIG_PHY_MTK_TPHY=m
force_drivers+=" mtu3 xhci-mtk-hcd phy-mtk-tphy "

# Dual-role dependencies of mtu3 (required by CONFIG_USB_MTU3_DUAL_ROLE=y):
#   udc-core       - USB gadget core                          CONFIG_USB_GADGET=m
#   roles          - USB role switch                          CONFIG_USB_ROLE_SWITCH=m
force_drivers+=" udc-core roles "
