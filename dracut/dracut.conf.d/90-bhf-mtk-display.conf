# MediaTek DisplayPort output of the SM0101. Load it from the initramfs, so
# that the display is taken over early and plymouth can show its splash,
# instead of waiting for the modules on the root file system:
#   drm_dp_aux_bus - DisplayPort AUX bus                      CONFIG_DRM_DISPLAY_DP_AUX_BUS=m
#   phy-mtk-dp     - MediaTek DisplayPort PHY                 CONFIG_PHY_MTK_DP=m
#   mtk_dp         - MediaTek DisplayPort controller          CONFIG_DRM_MEDIATEK_DP=m
force_drivers+=" drm_dp_aux_bus phy-mtk-dp mtk_dp "
